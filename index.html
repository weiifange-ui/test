        table {

            margin: auto;

            }

            td.image {
                width: 75%;
            }

            td.txt {
                width: 25%;
            }

            td img {
                width: 100%;

                /* opacity: 0.6; 圖片透明度 */
            }




            img {
                opacity: 1;
                transition: opacity 0.3s;
                /* 當圖片的透明度改變時，花 0.3 秒平滑地完成變化。 */
                /* 滑鼠移到圖片上，圖片會在 0.3 秒內逐漸變淡；滑鼠移開後，也會在 0.3 秒內恢復正常。 */
            }

            img:hover {
                /* 當滑鼠游標停留在圖片上時，套用大括號裡的 CSS 設定 */
                opacity: 0.5;
            }




        }
    </style>
